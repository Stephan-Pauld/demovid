<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Video</title>
  <style>
    body { margin: 0; background: #111; display: grid; place-items: center; min-height: 100vh; }
    video { max-width: 100%; max-height: 100vh; }
  </style>
</head>
<body>
  <video controls preload="metadata" playsinline>
    <source src="video.webm" type="video/webm">
    <!-- Optional fallback for older Safari: <source src="video.mp4" type="video/mp4"> -->
    Your browser can't play this video. <a href="video.webm">Download it</a>.
  </video>
</body>
</html>
